<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NBA MVP Predictor{% endblock %}</title>


    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='kyri.jpg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>


<div class="top">
    <div class="top-inner">
        <a class="site-name" href="{{ url_for('index') }}">
            <img class="logo" src="{{ url_for('static', filename='kyri.jpg') }}" alt="">
            <span>NBA <span class="accent">MVP</span> Predictor</span>
        </a>
        <nav>
            <a href="{{ url_for('index') }}" class="{% if page == 'season' %}active{% endif %}">Season</a>
            <a href="{{ url_for('history') }}" class="{% if page == 'history' %}active{% endif %}">Multi-Year</a>
            <a href="{{ url_for('testing') }}" class="{% if page == 'testing' %}active{% endif %}">Testing</a>
        </nav>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<div class="footer">
    Data from Basketball Reference.
</div>

</body>
</html>
