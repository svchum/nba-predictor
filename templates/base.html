<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NBA MVP Predictor{% endblock %}</title>

    <!-- the small icon in the browser tab (replace static/favicon.png with your headshot) -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='kyri.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- top bar with the site name and the two page links -->
<div class="top">
    <div class="top-inner">
        <a class="site-name" href="{{ url_for('index') }}">NBA MVP Predictor</a>
        <nav>
            <a href="{{ url_for('index') }}" class="{% if page == 'season' %}active{% endif %}">Season</a>
            <a href="{{ url_for('history') }}" class="{% if page == 'history' %}active{% endif %}">Multi-Year</a>
        </nav>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<div class="footer">
    Data from Basketball Reference. Models trained on seasons up to {{ train_end }}.
</div>

</body>
</html>
